<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NaijaRide — Offline</title>
<style>body{font-family:Inter,system-ui,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f0fdf4;color:#052e16;text-align:center;padding:24px}
.dot{width:56px;height:56px;border-radius:16px;background:#16a34a;display:inline-grid;place-items:center;color:#fff;font-size:28px;margin-bottom:16px}
h1{font-size:20px;margin:0 0 8px}p{color:#3f6212;margin:0 0 16px;max-width:320px}
button{background:#16a34a;color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:600;font-size:14px}</style></head>
<body><div><div class="dot">🚗</div><h1>You're offline</h1>
<p>NaijaRide needs a connection to search trips and book rides. Reconnect and try again.</p>
<button onclick="location.reload()">Retry</button></div></body></html>
